<!DOCTYPE html>

<meta name="theme-color" content="#05060f">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">

<!-- נתיב מוחלט: דף 404 מוגש גם מכתובות עמוקות, ונתיב יחסי היה נשבר שם -->
<link rel="stylesheet" href="/LevyGames/style.css?v=2">
<style>
  .err-code {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(4rem, 22vw, 9rem);
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 8px rgba(0,246,255,0.85), 0 0 30px rgba(255,43,214,0.55);
    margin: 0;
  }
  .err-text { color: var(--text-dim); font-size: 1rem; line-height: 1.7; max-width: 460px; margin: 20px auto 34px; }
  .err-link {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-decoration: none;
    padding: 14px 30px;
    color: #02131a;
    background: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 14px rgba(0,246,255,0.6);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .err-link:hover { background: #fff; box-shadow: 0 0 24px rgba(0,246,255,0.9); }
</style>
</head>
<body>
<div id="app">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="hub-header" style="margin-top: 8vh;">
    <p class="err-code">404</p>
    <div class="hub-divider"></div>
    <p class="err-text">הדף הזה לא קיים - אולי המשחק עבר מקום, או שנפלה טעות בכתובת.<br>בואו נחזור לדף המשחקים.</p>
    <a class="err-link" href="/LevyGames/">חזרה ל-LEVY GAMES</a>
  </header>
</div>
</body>
