<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הבלשית הקטנה — תיקי היגיון</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ===== הבלשית הקטנה — עיצוב ===== */
@font-face {
  font-family: 'Gveret Levin';
  src: url('../../assets/fonts/GveretLevinAlefAlefAlef-Regular.woff2') format('woff2'),
       url('../../assets/fonts/GveretLevinAlefAlefAlef-Regular.woff') format('woff');
  font-display: swap;
}
:root {
  --cream: #F5E6C8;
  --paper: #FBF3DF;
  --maroon: #8B2635;
  --maroon-deep: #4A1620;
  --mustard: #F2C14E;
  --sage: #7A9B76;
  --sky: #6FA8C9;
  --ink: #4A1620;
  --font-head: 'M PLUS Rounded 1c', 'Rubik', sans-serif;
  --font-body: 'Rubik', system-ui, sans-serif;
  --font-hand: 'Gveret Levin', 'Rubik', cursive;
  --radius: 20px;
  --shadow: 0 8px 24px rgba(74, 22, 32, 0.16);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(242,193,78,.25), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(122,155,118,.2), transparent 45%),
    var(--cream);
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; }

/* ===== כותרת עליונה ===== */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--maroon);
  color: var(--paper);
  box-shadow: var(--shadow);
  position: sticky; top: 0; z-index: 20;
}
header .back {
  text-decoration: none; color: var(--paper);
  background: rgba(255,255,255,.14);
  border: 2px solid rgba(255,255,255,.35);
  border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .9rem;
}
header h1 {
  font-family: var(--font-head); font-size: 1.25rem; margin: 0; flex: 1;
  display: flex; align-items: center; gap: 8px;
}
header .progress-pill {
  background: var(--mustard); color: var(--maroon-deep);
  border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: .85rem;
  white-space: nowrap;
}
header .icon-btn {
  background: rgba(255,255,255,.14); color: var(--paper);
  border: 2px solid rgba(255,255,255,.35);
  border-radius: 50%; width: 40px; height: 40px; font-size: 1.1rem;
}

main { max-width: 900px; margin: 0 auto; padding: 16px 14px 60px; }

/* ===== מסך לוח התיקים ===== */
.hero {
  display: flex; align-items: center; gap: 14px;
  background: var(--paper); border: 3px solid var(--maroon-deep);
  border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow);
  margin-bottom: 18px;
}
.hero img { width: 110px; height: auto; flex-shrink: 0; }
.hero h2 { font-family: var(--font-head); color: var(--maroon); margin: 0 0 6px; font-size: 1.5rem; }
.hero p { margin: 0; line-height: 1.5; }

.tools {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
}
.tool {
  display: flex; align-items: center; gap: 6px;
  background: var(--paper); border: 2px solid var(--maroon-deep);
  border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .85rem;
  box-shadow: 0 3px 0 var(--maroon-deep);
}
.tool.locked { opacity: .45; filter: grayscale(1); box-shadow: none; }
.tools-title { width: 100%; font-family: var(--font-hand); font-size: 1.2rem; color: var(--maroon); margin: 0; }

.case-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px;
}
.case-card {
  position: relative;
  background: linear-gradient(180deg, #F9EBC8, #F2DCA8);
  border: 3px solid var(--maroon-deep);
  border-radius: 14px 14px 16px 16px;
  padding: 34px 14px 14px;
  text-align: right;
  box-shadow: 0 5px 0 var(--maroon-deep);
  transition: transform .12s ease;
}
.case-card::before { /* לשונית תיקייה */
  content: ''; position: absolute; top: -14px; right: 14px;
  width: 40%; height: 16px; background: inherit;
  border: 3px solid var(--maroon-deep); border-bottom: none;
  border-radius: 10px 10px 0 0;
}
.case-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--maroon-deep); }
.case-card .case-num {
  position: absolute; top: 8px; inset-inline-start: 12px;
  font-family: var(--font-hand); font-size: 1rem; color: var(--maroon);
}
.case-card .case-icon { font-size: 2.1rem; display: block; margin-bottom: 6px; }
.case-card h3 { margin: 0 0 8px; font-size: 1rem; line-height: 1.35; font-family: var(--font-head); color: var(--maroon-deep); }
.case-card .case-tool { font-size: .78rem; font-weight: 600; color: #6b4a2f; }
.case-card .stamp {
  position: absolute; top: 30px; inset-inline-start: 10px;
  font-family: var(--font-hand); color: var(--sage);
  border: 3px solid var(--sage); border-radius: 8px; padding: 2px 8px;
  transform: rotate(-12deg); font-size: .95rem; background: rgba(255,255,255,.75);
}
.board-footer { text-align: center; margin-top: 26px; }
.board-footer button {
  background: none; border: none; color: #9b7050; text-decoration: underline; font-size: .8rem;
}

/* ===== מסך תיק ===== */
.case-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.case-top .to-board {
  background: var(--paper); border: 2px solid var(--maroon-deep); border-radius: 999px;
  padding: 7px 14px; font-weight: 600; font-size: .85rem; box-shadow: 0 3px 0 var(--maroon-deep);
}
.case-top .case-label { font-family: var(--font-hand); color: var(--maroon); font-size: 1.15rem; }
.case-top .narrate {
  margin-inline-start: auto;
  background: var(--sky); border: 2px solid var(--maroon-deep); border-radius: 999px;
  padding: 7px 14px; font-weight: 600; font-size: .85rem; color: var(--maroon-deep);
  box-shadow: 0 3px 0 var(--maroon-deep);
}
.case-top .narrate.speaking { background: var(--mustard); animation: pulse 1s infinite; }

.mission {
  background: var(--maroon); color: var(--paper);
  border: 3px solid var(--maroon-deep); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
  position: relative;
}
.mission .mission-tag {
  position: absolute; top: -14px; inset-inline-start: 16px;
  background: var(--mustard); color: var(--maroon-deep);
  font-weight: 800; font-size: .78rem; border: 2px solid var(--maroon-deep);
  border-radius: 999px; padding: 3px 12px;
}
.mission .story { margin: 4px 0 8px; font-size: .95rem; opacity: .92; line-height: 1.5; }
.mission .question {
  font-family: var(--font-head); font-size: 1.35rem; line-height: 1.4; margin: 0;
  display: flex; gap: 8px; align-items: flex-start;
}
.mission .question::before { content: '🔍'; }

.evidence {
  background: var(--paper); border: 3px dashed var(--maroon);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px;
}
.evidence h4 { margin: 0 0 8px; font-family: var(--font-hand); color: var(--maroon); font-size: 1.15rem; }
.evidence ol { margin: 0; padding-inline-start: 22px; }
.evidence li { margin: 6px 0; line-height: 1.5; font-size: 1rem; padding: 3px 6px; border-radius: 8px; }
.evidence li.flash { animation: clueFlash 1.2s ease 2; background: #FBE3A0; }
.evidence .footprint-wrap { text-align: center; }
.evidence .footprint-wrap svg { width: 120px; height: auto; }

.board-area {
  background: var(--paper); border: 3px solid var(--maroon-deep);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.board-area h4 { margin: 0 0 12px; font-family: var(--font-hand); color: var(--maroon); font-size: 1.15rem; }

/* בועת משוב */
.bubble {
  min-height: 54px; display: flex; align-items: center; gap: 10px;
  background: #fff; border: 3px solid var(--maroon-deep); border-radius: 16px;
  padding: 10px 14px; margin-bottom: 8px; font-size: 1rem; line-height: 1.45;
  position: relative; opacity: 0; transform: translateY(6px); transition: all .2s ease;
}
.bubble.show { opacity: 1; transform: none; }
.bubble.bad { background: #FADFD7; }
.bubble.good { background: #DFEBDD; }
.bubble.info { background: #E3EFF6; }
.bubble .who { font-size: 1.5rem; }

/* ===== מגש דמויות ולוח שיבוץ ===== */
.tray { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
.token {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: #fff; border: 3px solid var(--maroon-deep); border-radius: 14px;
  padding: 8px 10px 6px; min-width: 84px;
  box-shadow: 0 3px 0 var(--maroon-deep); transition: transform .12s ease;
}
.token .avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--cream); border: 2px solid var(--maroon-deep);
  overflow: hidden; display: flex; align-items: flex-start; justify-content: center;
}
.token .avatar img { width: 88%; height: auto; margin-top: 4%; }
.token .avatar .emoji-face { font-size: 2rem; line-height: 54px; }
.token .t-name { font-weight: 800; font-size: .9rem; }
.token.selected { transform: translateY(-5px); border-color: var(--mustard); box-shadow: 0 0 0 4px var(--mustard), 0 5px 0 var(--maroon-deep); }
.token.used { visibility: hidden; position: absolute; pointer-events: none; }

.socket {
  width: 74px; height: 74px; border-radius: 50%;
  border: 3px dashed #b08a5a; background: rgba(255,255,255,.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; color: #b08a5a; font-weight: 800;
  transition: border-color .15s ease; padding: 0;
}
.socket.filled { border-style: solid; border-color: var(--maroon-deep); background: #fff; overflow: hidden; }
.socket.filled .avatar { width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center; }
.socket.filled .avatar img { width: 88%; margin-top: 6%; }
.socket.filled .avatar .emoji-face { font-size: 2.2rem; line-height: 68px; }
.socket.fixed { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(122,155,118,.4); }
.socket.answer-glow { animation: glow 0.9s ease 3; }
.socket-name { font-size: .8rem; font-weight: 800; text-align: center; margin-top: 3px; min-height: 1.1em; }

/* לוח ארוניות — כיוון קבוע LTR כדי ש"ימין" יהיה ימין של המסך */
.lockers-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; direction: ltr; }
.locker-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.locker-col img { width: 96px; height: auto; border-radius: 10px; }

/* שולחן פיקניק */
.picnic-wrap { position: relative; width: 340px; height: 340px; margin: 0 auto; max-width: 100%; }
.picnic-table {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 150px; height: 150px; border-radius: 50%;
  background: var(--sage); border: 4px solid var(--maroon-deep);
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
}
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; width: 90px; }
.seat.n { top: 0; left: 50%; transform: translateX(-50%); }
.seat.s { bottom: 0; left: 50%; transform: translateX(-50%); }
.seat.e { right: 0; top: 50%; transform: translateY(-50%); }
.seat.w { left: 0; top: 50%; transform: translateY(-50%); }
.compass { font-size: .75rem; font-weight: 800; color: var(--maroon); }
.leo-hint {
  font-size: .72rem; background: #FBE3A0; border: 2px solid var(--maroon-deep);
  border-radius: 8px; padding: 2px 6px; margin-top: 2px; white-space: nowrap;
}

/* פודיום גבהים + ציר זמן */
.podium-row, .timeline-row { display: flex; gap: 14px; justify-content: center; align-items: flex-end; flex-wrap: wrap; }
.podium-col, .time-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.podium-step {
  width: 80px; background: var(--mustard); border: 3px solid var(--maroon-deep);
  border-radius: 8px 8px 0 0; display: flex; align-items: flex-end; justify-content: center;
  font-weight: 800; padding-bottom: 4px; color: var(--maroon-deep);
}
.step-label { font-size: .74rem; font-weight: 800; text-align: center; color: #6b4a2f; max-width: 84px; }
.time-col .clock { font-size: 2rem; }
.time-col .time-label { font-weight: 800; font-size: .85rem; }

/* ===== רשת היגיון ===== */
.grid-table { border-collapse: collapse; margin: 0 auto; }
.grid-table th, .grid-table td { border: 2px solid var(--maroon-deep); padding: 6px; text-align: center; }
.grid-table th { background: #F2DCA8; font-size: .85rem; }
.grid-table th .col-emoji { display: block; font-size: 1.5rem; }
.grid-table th.row-head { font-size: .92rem; min-width: 64px; }
.grid-cell {
  width: 56px; height: 52px; border: none; background: #fff;
  font-size: 1.5rem; font-weight: 800; border-radius: 0; display: block; margin: 0 auto;
  width: 100%; height: 46px;
}
.grid-cell.mark-x { color: var(--maroon); }
.grid-cell.mark-v { color: var(--sage); background: #E7F0E5; }
.grid-cell.auto-x { color: #c9b08a; background: #FAF4E4; }
.grid-legend { text-align: center; font-size: .82rem; color: #6b4a2f; margin-top: 10px; line-height: 1.5; }

/* ===== התאמת פרטים ===== */
.cands { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
.cand {
  position: relative; background: #fff; border: 3px solid var(--maroon-deep);
  border-radius: 14px; padding: 10px; text-align: center;
  box-shadow: 0 4px 0 var(--maroon-deep); transition: transform .12s ease;
}
.cand:active { transform: translateY(2px); }
.cand img, .cand svg { width: 100%; max-width: 150px; height: auto; border-radius: 10px; }
.cand .cand-name { font-weight: 800; margin-top: 6px; }
.cand .chips { display: none; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 6px; }
.cand .chips span { background: var(--cream); border: 1.5px solid var(--maroon-deep); border-radius: 999px; padding: 1px 8px; font-size: .72rem; font-weight: 600; }
.cands.show-chips .cand .chips { display: flex; }
.cand.eliminated { filter: grayscale(.9); opacity: .55; }
.cand.eliminated::after {
  content: '✗'; position: absolute; top: 6px; left: 50%; transform: translateX(-50%) rotate(-14deg);
  font-size: 4.5rem; color: var(--maroon); font-weight: 800; text-shadow: 0 0 6px #fff;
}
.cand .why {
  display: none; font-size: .74rem; background: #FADFD7; border: 2px solid var(--maroon);
  border-radius: 8px; padding: 3px 6px; margin-top: 6px; line-height: 1.35;
}
.cand.eliminated .why { display: block; }
.cand.last-glow { animation: glow .9s ease infinite; }

/* תגים (תיק 7) */
.badge-vis {
  width: 130px; height: 130px; border-radius: 50%; margin: 0 auto;
  background: var(--paper); border: 6px solid var(--mustard);
  outline: 3px solid var(--maroon-deep); position: relative;
}
.badge-vis .sym { position: absolute; font-size: 2rem; }
.badge-vis .sym:nth-child(1) { top: 8px; left: 50%; transform: translateX(-50%); }
.badge-vis .sym:nth-child(2) { bottom: 14px; left: 16px; }
.badge-vis .sym:nth-child(3) { bottom: 14px; right: 16px; }

/* ===== סגירת תיק ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(74,22,32,.55); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.closed-card {
  background: var(--paper); border: 4px solid var(--maroon-deep); border-radius: 24px;
  padding: 26px 22px; max-width: 460px; width: 100%; text-align: center;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
  animation: popIn .35s cubic-bezier(.2,1.4,.4,1);
}
.closed-card img.mascot { width: 120px; }
.closed-stamp {
  display: inline-block; font-family: var(--font-hand); font-size: 2rem; color: var(--maroon);
  border: 4px solid var(--maroon); border-radius: 12px; padding: 4px 18px;
  transform: rotate(-8deg); margin-bottom: 10px; background: rgba(255,255,255,.8);
  animation: stampIn .5s cubic-bezier(.2,1.6,.4,1) .15s backwards;
}
.closed-card .closing-text { font-size: 1.05rem; line-height: 1.6; margin: 10px 0 4px; }
.closed-card .tool-toast {
  background: var(--mustard); border: 2px solid var(--maroon-deep); border-radius: 12px;
  padding: 8px 12px; font-weight: 800; margin: 10px 0 0; display: none;
}
.closed-card .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.closed-card .btns button {
  border: 3px solid var(--maroon-deep); border-radius: 999px; padding: 10px 20px;
  font-weight: 800; font-size: 1rem; box-shadow: 0 3px 0 var(--maroon-deep);
}
.btn-next { background: var(--mustard); }
.btn-board { background: #fff; }
.confetti-bit { position: absolute; width: 10px; height: 16px; top: -20px; animation: fall linear forwards; }

/* ===== אנימציות ===== */
@keyframes clueFlash { 0%,100% { background: #FBE3A0; } 50% { background: #F2C14E; } }
@keyframes shakeX { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.shake { animation: shakeX .4s ease; }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(242,193,78,0); } 50% { box-shadow: 0 0 0 8px rgba(242,193,78,.85); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes stampIn { from { transform: rotate(-8deg) scale(2.4); opacity: 0; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
@keyframes fall { to { transform: translateY(110vh) rotate(560deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.hidden { display: none !important; }
@media (max-width: 480px) {
  .hero img { width: 80px; }
  .mission .question { font-size: 1.15rem; }
  .picnic-wrap { width: 300px; height: 300px; }
}
</style>
</head>
<body>

<header>
  <a class="back" href="../../index.html">⬅ למשחקים</a>
  <h1>🕵️‍♀️ הבלשית הקטנה</h1>
  <span class="progress-pill" id="progressPill">0/10 תיקים</span>
  <button class="icon-btn" id="muteBtn" aria-label="השתקה / הפעלת צלילים">🔊</button>
</header>

<main>
  <!-- ===== מסך לוח התיקים ===== -->
  <section id="boardScreen">
    <div class="hero">
      <img src="images/detective-mascot.png" alt="הבלשית הקטנה">
      <div>
        <h2>ברוכה הבאה לסוכנות הבלשים!</h2>
        <p>בכל תיק מסתתרת תעלומה. קראי את הרמזים, הפעילי את הראש — ופתרי אותה בעצמך. בהצלחה, בלשית!</p>
      </div>
    </div>
    <div class="tools" id="toolsStrip">
      <p class="tools-title">🧰 ערכת הבלשית שלי:</p>
    </div>
    <div class="case-grid" id="caseGrid"></div>
    <div class="board-footer">
      <button id="resetBtn">איפוס התקדמות</button>
    </div>
  </section>

  <!-- ===== מסך תיק ===== -->
  <section id="caseScreen" class="hidden">
    <div class="case-top">
      <button class="to-board" id="backToBoard">📁 ללוח התיקים</button>
      <span class="case-label" id="caseLabel"></span>
      <button class="narrate" id="narrateBtn">🔊 הקראה</button>
    </div>

    <div class="mission">
      <span class="mission-tag">המשימה שלך</span>
      <p class="story" id="caseStory"></p>
      <p class="question" id="caseQuestion"></p>
    </div>

    <div class="evidence">
      <h4>📌 לוח הראיות</h4>
      <div id="evidenceExtra"></div>
      <ol id="cluesList"></ol>
    </div>

    <div class="bubble" id="bubble" aria-live="polite"></div>

    <div class="board-area">
      <h4 id="boardTitle"></h4>
      <div id="boardMount"></div>
    </div>
  </section>
</main>

<!-- ===== שכבת סגירת תיק ===== -->
<div class="overlay hidden" id="closedOverlay">
  <div class="closed-card" id="closedCard">
    <div class="closed-stamp">✔ התיק נסגר!</div>
    <div><img class="mascot" src="images/detective-mascot.png" alt=""></div>

/* ================= ארגז כלים (מטא-משחק) ================= */
const TOOL_TYPES = {
  spatial: { emoji: '🗺️', name: 'מפת הזירה' },
  grid:    { emoji: '🧮', name: 'רשת ההיגיון' },
  rack:    { emoji: '📐', name: 'סרגל הסדר' },
  detail:  { emoji: '🔍', name: 'זכוכית המגדלת' },
};

/* ================= מצב ושמירה ================= */
const STORE_KEY = 'littleDetectiveProgress';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || { solved: {} }; }
  catch (e) { return { solved: {} }; }
}
function saveProgress(p) { localStorage.setItem(STORE_KEY, JSON.stringify(p)); }
let progress = loadProgress();
let currentCase = null;

/* ================= אלמנטים ================= */
const $ = id => document.getElementById(id);
const boardScreen = $('boardScreen'), caseScreen = $('caseScreen');
const bubble = $('bubble');
let bubbleTimer = null;

/* ================= מסך לוח התיקים ================= */
function unlockedTools() {
  const types = new Set(CASES.filter(c => progress.solved[c.id]).map(c => c.type));
  return types;
}
function renderBoard() {
  const solvedCount = Object.keys(progress.solved).length;
  $('progressPill').textContent = `${solvedCount}/${CASES.length} תיקים`;

  const strip = $('toolsStrip');
  strip.querySelectorAll('.tool').forEach(el => el.remove());
  const owned = unlockedTools();
  Object.entries(TOOL_TYPES).forEach(([type, t]) => {
    const el = document.createElement('span');
    el.className = 'tool' + (owned.has(type) ? '' : ' locked');
    el.textContent = `${t.emoji} ${t.name}`;
    strip.appendChild(el);
  });

  const grid = $('caseGrid');
  grid.innerHTML = '';
  CASES.forEach(c => {
    const solved = !!progress.solved[c.id];
    const card = document.createElement('button');
    card.className = 'case-card';
    card.innerHTML = `
      <span class="case-num">תיק מס' ${c.num}</span>
      ${solved ? '<span class="stamp">נסגר ✔</span>' : ''}
      <span class="case-icon">${c.icon}</span>
      <h3>${c.title}</h3>
      <span class="case-tool">${TOOL_TYPES[c.type].emoji} ${TOOL_TYPES[c.type].name}</span>`;
    card.addEventListener('click', () => { playSfx('open'); openCase(c); });
    grid.appendChild(card);
  });
}

/* ================= בועת משוב + הבהוב רמז ================= */
function showBubble(msg, kind, who) {
  clearTimeout(bubbleTimer);
  bubble.className = 'bubble show ' + (kind || 'info');
  bubble.innerHTML = `<span class="who">${who || (kind === 'bad' ? '🤔' : kind === 'good' ? '🕵️‍♀️' : '💡')}</span><span>${msg}</span>`;
  bubbleTimer = setTimeout(() => { bubble.classList.remove('show'); }, 5000);
}
function flashClue(idx) {
  const li = $('cluesList').children[idx];
  if (!li) return;
  li.classList.remove('flash');
  void li.offsetWidth; // מאלץ ריסטרט של האנימציה
  li.classList.add('flash');
}
function shakeEl(el) {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}

/* ================= פתיחת תיק ================= */
function openCase(c) {
  currentCase = c;
  stopNarration();
  boardScreen.classList.add('hidden');
  caseScreen.classList.remove('hidden');
  window.scrollTo(0, 0);

  $('caseLabel').textContent = `תיק מס' ${c.num} · ${c.title}`;
  $('caseStory').textContent = c.story;
  $('caseQuestion').textContent = c.mission;
  $('boardTitle').textContent = c.boardTitle;
  $('evidenceExtra').innerHTML = c.evidenceExtra ? c.evidenceExtra() : '';
  const ol = $('cluesList');
  ol.innerHTML = '';
  c.clues.forEach(text => {
    const li = document.createElement('li');
    li.textContent = text;
    ol.appendChild(li);
  });
  bubble.className = 'bubble';
  bubble.innerHTML = '';

  const mount = $('boardMount');
  mount.innerHTML = '';
  if (c.type === 'grid') buildGrid(c, mount);
  else if (c.type === 'detail') buildDetail(c, mount);
  else buildPlacement(c, mount); // spatial + rack
}

/* ================= מנוע שיבוץ (מרחבי + סידור) ================= */
function buildPlacement(c, mount) {
  const st = { selected: null, placed: {} };

  // מגש דמויות
  const tray = document.createElement('div');
  tray.className = 'tray';
  const tokenEls = {};
  c.tokens.forEach(tid => {
    const b = document.createElement('button');
    b.className = 'token';
    b.innerHTML = avatarHtml(tid) + `<span class="t-name">${KIDS[tid].name}</span>`;
    b.addEventListener('click', () => {
      if (st.placed[tid] !== undefined) return;
      playSfx('tap');
      st.selected = st.selected === tid ? null : tid;
      Object.values(tokenEls).forEach(el => el.classList.remove('selected'));
      if (st.selected) b.classList.add('selected');
    });
    tokenEls[tid] = b;
    tray.appendChild(b);
  });
  mount.appendChild(tray);

  // בניית לוח לפי פריסה
  const sockets = [];
  const socketNames = [];
  function mkSocket(idx) {
    const s = document.createElement('button');
    s.className = 'socket';
    s.textContent = '?';
    s.setAttribute('aria-label', 'מקום פנוי');
    s.addEventListener('click', () => socketTap(idx));
    sockets[idx] = s;
    return s;
  }
  function mkName(idx) {
    const n = document.createElement('div');
    n.className = 'socket-name';
    socketNames[idx] = n;
    return n;
  }

  if (c.layout === 'lockers') {
    const row = document.createElement('div');
    row.className = 'lockers-row';
    c.slots.forEach((sl, i) => {
      const col = document.createElement('div');
      col.className = 'locker-col';
      col.innerHTML = `<img src="${sl.img}" alt="ארונית ${sl.label}">`;
      col.appendChild(mkSocket(i));
      col.appendChild(mkName(i));
      row.appendChild(col);
    });
    mount.appendChild(row);
  } else if (c.layout === 'picnic') {
    const wrap = document.createElement('div');
    wrap.className = 'picnic-wrap';
    wrap.innerHTML = `<div class="picnic-table">🧺</div>`;
    c.slots.forEach((sl, i) => {
      const seat = document.createElement('div');
      seat.className = 'seat ' + sl.pos;
      const comp = document.createElement('div');
      comp.className = 'compass';
      comp.textContent = sl.label;
      seat.appendChild(comp);
      seat.appendChild(mkSocket(i));
      seat.appendChild(mkName(i));
      if (i === 0) {
        const hint = document.createElement('div');
        hint.className = 'leo-hint';
        hint.textContent = '⬅ היד הימנית של ליאו';
        seat.appendChild(hint);
      }
      wrap.appendChild(seat);
    });
    mount.appendChild(wrap);
  } else if (c.layout === 'podium') {
    const row = document.createElement('div');
    row.className = 'podium-row';
    c.slots.forEach((sl, i) => {
      const col = document.createElement('div');
      col.className = 'podium-col';
      col.appendChild(mkSocket(i));
      const step = document.createElement('div');
      step.className = 'podium-step';
      step.style.height = sl.h + 'px';
      step.textContent = i + 1;
      col.appendChild(step);
      const lbl = document.createElement('div');
      lbl.className = 'step-label';
      lbl.textContent = sl.label;
      col.appendChild(lbl);
      col.insertBefore(mkName(i), step);
      row.appendChild(col);
    });
    mount.appendChild(row);
  } else if (c.layout === 'timeline') {
    const row = document.createElement('div');
    row.className = 'timeline-row';
    c.slots.forEach((sl, i) => {
      const col = document.createElement('div');
      col.className = 'time-col';
      col.innerHTML = `<span class="clock">${sl.clock}</span><span class="time-label">${sl.label}</span>`;
      col.appendChild(mkSocket(i));
      col.appendChild(mkName(i));
      row.appendChild(col);
    });
    mount.appendChild(row);
  }

  // דמויות קבועות מראש (נתון בתיק, לא חלק מהחידה)
  function fillSocket(idx, tid, isFixed) {
    const s = sockets[idx];
    s.classList.add('filled');
    if (isFixed) s.classList.add('fixed');
    s.innerHTML = avatarHtml(tid);
    s.setAttribute('aria-label', KIDS[tid].name);
    socketNames[idx].textContent = KIDS[tid].name;
  }
  Object.entries(c.fixed || {}).forEach(([tid, idx]) => fillSocket(idx, tid, true));

  function tokenAt(idx) {
    return Object.keys(st.placed).find(t => st.placed[t] === idx);
  }

  function socketTap(idx) {
    const fixedToken = Object.keys(c.fixed || {}).find(t => c.fixed[t] === idx);
    if (fixedToken) {
      playSfx('tap');
      showBubble(`${KIDS[fixedToken].name} כבר במקום — זה נתון בתיק!`, 'info');
      return;
    }
    const occupant = tokenAt(idx);
    if (occupant && !st.selected) {
      // הסרה חזרה למגש
      playSfx('tap');
      delete st.placed[occupant];
      const s = sockets[idx];
      s.classList.remove('filled');
      s.textContent = '?';
      socketNames[idx].textContent = '';
      tokenEls[occupant].classList.remove('used');
      return;
    }
    if (!st.selected) {
      showBubble('קודם בחרי דמות מהמגש למטה 👇', 'info');
      return;
    }
    if (occupant) {
      showBubble('המקום הזה תפוס — אפשר להקיש עליו כדי לפנות אותו.', 'info');
      return;
    }
    const tid = st.selected;
    if (c.solution[tid] === idx) {
      // שיבוץ תקין — ננעל במקום
      playSfx('place');
      st.placed[tid] = idx;
      fillSocket(idx, tid, false);
      tokenEls[tid].classList.remove('selected');
      tokenEls[tid].classList.add('used');
      st.selected = null;
      checkComplete();
    } else {
      // דחייה סיבתית: הרמז הספציפי שנשבר
      playSfx('error');
      shakeEl(sockets[idx]);
      const r = c.reject[`${tid}-${idx}`] || { c: 0, m: 'משהו כאן מתנגש עם הרמזים — נסי שוב!' };
      showBubble(r.m, 'bad');
      flashClue(r.c);
    }
  }

  function checkComplete() {
    const done = c.tokens.every(t => st.placed[t] !== undefined);
    if (!done) return;
    // הדגשת התשובה למשימה מתוך מצב הלוח, ואז סגירת תיק
    const ansIdx = c.solution[c.answerToken];
    if (ansIdx !== undefined) sockets[ansIdx].classList.add('answer-glow');
    setTimeout(() => caseSolved(c), 1400);
  }
}

/* ================= מנוע רשת היגיון ================= */
function buildGrid(c, mount) {
  const marks = {}; // 'row-col' -> 'x' | 'v'
  const cellEls = {};

  const table = document.createElement('table');
  table.className = 'grid-table';
  const thead = document.createElement('tr');
  thead.innerHTML = '<th></th>' + c.cols.map(col =>
    `<th><span class="col-emoji">${col.emoji}</span>${col.name}</th>`).join('');
  table.appendChild(thead);

  c.rows.forEach(row => {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.className = 'row-head';
    th.innerHTML = `${row.emoji} ${row.name}`;
    tr.appendChild(th);
    c.cols.forEach(col => {
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'grid-cell';
      btn.addEventListener('click', () => cellTap(row.id, col.id));
      cellEls[`${row.id}-${col.id}`] = btn;
      td.appendChild(btn);
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  mount.appendChild(table);

  const legend = document.createElement('div');
  legend.className = 'grid-legend';
  legend.innerHTML = 'הקשה על משבצת: ריק ← ✗ ← ✓ ← ריק.<br>כשמסמנים ✓ — שאר המשבצות בשורה ובטור מקבלות ✗ אוטומטית (כל אחד מקבל בדיוק אחד!)';
  mount.appendChild(legend);

  function vInRow(rowId) { return c.cols.some(col => marks[`${rowId}-${col.id}`] === 'v'); }
  function vInCol(colId) { return c.rows.some(row => marks[`${row.id}-${colId}`] === 'v'); }

  function refresh() {
    c.rows.forEach(row => c.cols.forEach(col => {
      const key = `${row.id}-${col.id}`;
      const el = cellEls[key];
      const m = marks[key];
      el.classList.remove('mark-x', 'mark-v', 'auto-x');
      if (m === 'v') { el.textContent = '✓'; el.classList.add('mark-v'); }
      else if (m === 'x') { el.textContent = '✗'; el.classList.add('mark-x'); }
      else if (vInRow(row.id) || vInCol(col.id)) { el.textContent = '✗'; el.classList.add('auto-x'); }
      else el.textContent = '';
    }));
  }

  function cellTap(rowId, colId) {
    const key = `${rowId}-${colId}`;
    const cur = marks[key];
    const el = cellEls[key];
    if (cur === 'v') {
      playSfx('toggle');
      delete marks[key];
    } else if (cur === 'x') {
      // ניסיון לסמן ✓ — אכיפת חוק המבנה בלבד (לא פרשנות רמזים)
      if (vInRow(rowId) || vInCol(colId)) {
        playSfx('error');
        shakeEl(el);
        showBubble('כבר יש ✓ בשורה או בטור האלה — כל אחד מקבל בדיוק אחד!', 'bad');
        return;
      }
      playSfx('place');
      marks[key] = 'v';
    } else {
      if (vInRow(rowId) || vInCol(colId)) {
        playSfx('error');
        shakeEl(el);
        showBubble('המשבצת הזאת כבר קיבלה ✗ אוטומטי — יש ✓ בשורה או בטור שלה.', 'bad');
        return;
      }
      playSfx('toggle');
      marks[key] = 'x';
    }
    refresh();
    if (marks[key] === 'v') maybeValidate();
  }

  function maybeValidate() {
    const allMarked = c.rows.every(row => vInRow(row.id));
    if (!allMarked) return;
    // הלוח מלא — בודקים מול הרמזים ומחזירים משוב סיבתי ספציפי
    for (const row of c.rows) {
      const vCol = c.cols.find(col => marks[`${row.id}-${col.id}`] === 'v').id;
      if (c.solution[row.id] !== vCol) {
        const w = c.wrong[`${row.id}-${vCol}`] || { c: 0, m: 'משהו לא מסתדר עם הרמזים — בדקי שוב!' };
        playSfx('error');
        shakeEl(cellEls[`${row.id}-${vCol}`]);
        showBubble(w.m, 'bad');
        flashClue(w.c);
        return;
      }
    }
    setTimeout(() => caseSolved(c), 700);
  }

  refresh();
}

/* ================= מנוע התאמת פרטים ================= */
function buildDetail(c, mount) {
  const gone = new Set();
  let wrongTaps = 0;
  const cardEls = {};

  const grid = document.createElement('div');
  grid.className = 'cands';
  c.candidates.forEach(cand => {
    const card = document.createElement('button');
    card.className = 'cand';
    card.innerHTML = `${cand.html()}
      <div class="cand-name">${cand.name}</div>
      <div class="chips">${cand.chips.map(ch => `<span>${ch}</span>`).join('')}</div>
      <div class="why"></div>`;
    card.addEventListener('click', () => candTap(cand.id));
    cardEls[cand.id] = card;
    grid.appendChild(card);
  });
  mount.appendChild(grid);

  function remaining() { return c.candidates.filter(x => !gone.has(x.id)); }

  function candTap(id) {
    if (gone.has(id)) { playSfx('tap'); return; }
    const cand = c.candidates.find(x => x.id === id);
    const rem = remaining();

    if (!cand.reason) {
      // זה המועמד האמיתי
      if (rem.length > 1) {
        // עדיין לא הוכרע — דחיפה קדימה, לא הפסד ולא חשיפה
        playSfx('error');
        shakeEl(cardEls[id]);
        wrongTaps++;
        if (wrongTaps >= 2) {
          grid.classList.add('show-chips');
          showBubble('טיפ: תסתכלי על הפרטים הקטנים שמתחת לכל תמונה והשווי אותם לרמזים.', 'info');
        } else {
          showBubble('רגע! יש עוד חשודים שאפשר לפסול — בדקי שוב את הרמזים.', 'info');
        }
        return;
      }
      // נשאר אחרון — זו התשובה הסופית של הבלשית
      playSfx('star');
      caseSolved(c, cand.name);
      return;
    }

    // פסילה נכונה — הילדה מצאה סתירה אמיתית
    playSfx('swipe');
    gone.add(id);
    cardEls[id].classList.add('eliminated');
    cardEls[id].querySelector('.why').textContent = cand.reason.m;
    showBubble('בדיוק! ' + cand.reason.m, 'good');
    flashClue(cand.reason.c);

    const remNow = remaining();
    if (remNow.length === 1) {
      const lastEl = cardEls[remNow[0].id];
      setTimeout(() => {
        lastEl.classList.add('last-glow');
        showBubble('נשאר רק אחד! הקישי עליו כדי לסגור את התיק. 🎯', 'info');
      }, 900);
    }
  }
}

/* ================= סגירת תיק ================= */
function caseSolved(c, dynamicName) {
  const toolsBefore = unlockedTools();
  const firstTime = !progress.solved[c.id];
  progress.solved[c.id] = Date.now();
  saveProgress(progress);

  playSfx('win');
  setTimeout(() => playSfx('star'), 500);

  $('closingText').textContent = c.closing.replace('{name}', dynamicName || '');
  const toast = $('toolToast');
  if (firstTime && !toolsBefore.has(c.type)) {
    const t = TOOL_TYPES[c.type];
    toast.textContent = `🧰 כלי חדש נוסף לערכה: ${t.emoji} ${t.name}!`;
    toast.style.display = 'block';
  } else {
    toast.style.display = 'none';
  }

  const nextCase = CASES.find(x => !progress.solved[x.id]);
  $('nextCaseBtn').style.display = nextCase ? '' : 'none';

  // קונפטי
  const card = $('closedCard');
  card.querySelectorAll('.confetti-bit').forEach(el => el.remove());
  const colors = ['#F2C14E', '#8B2635', '#7A9B76', '#6FA8C9', '#E58BB0'];
  for (let i = 0; i < 26; i++) {
    const bit = document.createElement('span');
    bit.className = 'confetti-bit';
    bit.style.left = Math.random() * 100 + '%';
    bit.style.background = colors[i % colors.length];
    bit.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    bit.style.animationDelay = (Math.random() * 0.7) + 's';
    card.appendChild(bit);
  }

  $('closedOverlay').classList.remove('hidden');
}

$('nextCaseBtn').addEventListener('click', () => {
  playSfx('button');
  $('closedOverlay').classList.add('hidden');
  const next = CASES.find(x => !progress.solved[x.id]);
  if (next) { playSfx('open'); openCase(next); }
  else goBoard();
});
$('overlayBoardBtn').addEventListener('click', () => {
  playSfx('button');
  $('closedOverlay').classList.add('hidden');
  goBoard();
});

/* ================= ניווט ================= */
function goBoard() {
  stopNarration();
  currentCase = null;
  caseScreen.classList.add('hidden');
  boardScreen.classList.remove('hidden');
  renderBoard();
  window.scrollTo(0, 0);
}
$('backToBoard').addEventListener('click', () => { playSfx('button'); goBoard(); });

$('resetBtn').addEventListener('click', () => {
  if (confirm('לאפס את כל ההתקדמות? כל התיקים ייפתחו מחדש.')) {
    progress = { solved: {} };
    saveProgress(progress);
    renderBoard();
  }
});

/* ================= השתקה ================= */
const muteBtn = $('muteBtn');
function refreshMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('ldMuted', muted ? '1' : '0');
  refreshMute();
  if (!muted) playSfx('tap');
});
refreshMute();

/* ================= הקראה (תמיכה במי שעוד לא קוראת שוטף) ================= */
let speaking = false;
const narrateBtn = $('narrateBtn');
function stopNarration() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false;
  narrateBtn.classList.remove('speaking');
}
narrateBtn.addEventListener('click', () => {
  if (!('speechSynthesis' in window)) {
    showBubble('הדפדפן הזה לא תומך בהקראה.', 'info');
    return;
  }
  if (speaking) { stopNarration(); return; }
  const c = currentCase;
  if (!c) return;
  const text = [c.story, 'המשימה: ' + c.mission, 'הרמזים:', ...c.clues].join('. ');
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'he-IL';
  u.rate = 0.92;
  u.onend = () => { speaking = false; narrateBtn.classList.remove('speaking'); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  speaking = true;
  narrateBtn.classList.add('speaking');
});

/* ================= התחלה ================= */
renderBoard();
</script>
