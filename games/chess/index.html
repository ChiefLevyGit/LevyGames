<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ממלכת הקסמים - שחמט | Levy Games</title>
<meta name="description" content="שחמט לילדות: מצב 'חוקי הקסם' שמדליק בדיוק לאן מותר לכל כלי ללכת, ומצב חופשי בלי חוקים בכלל. עם ביטול מהלך, שמירת משחק והכתרה.">
<meta name="theme-color" content="#7c5cbf">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Levy Games">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="ממלכת הקסמים - שחמט">
<meta property="og:description" content="שחמט לילדות: מצב 'חוקי הקסם' שמדליק לאן מותר לזוז, ומצב חופשי בלי חוקים בכלל.">
<meta property="og:url" content="https://chieflevygit.github.io/LevyGames/games/chess/">
<meta property="og:image" content="https://chieflevygit.github.io/LevyGames/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <div class="sky-bg" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="castle-silhouette"></div>
  </div>

  <a href="../../index.html" class="hub-link" title="לדף המשחקים">🎮 Levy Games</a>

  <header class="topbar">
    <h1 class="logo">♛ ממלכת הקסמים <span class="logo-sub">שחמט לילי</span> ♞</h1>
  </header>

  <!-- הכרזות לקוראי מסך: תור, שח, סיום משחק -->
  <div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>

  <main>
    <section id="startScreen" class="screen">
      <h2 class="section-title">איך רוצות לשחק היום?</h2>

      <button id="resumeCard" class="resume-card hidden" type="button">
        <span class="resume-icon">⏳</span>
        <span class="resume-text">
          <strong>להמשיך את המשחק שלא נגמר</strong>
          <span class="resume-sub">מצב: <span id="resumeMode"></span></span>
        </span>
      </button>

      <div class="mode-cards">
        <button class="mode-card mode-rules" data-mode="rules">
          <div class="mode-icon">🏰</div>
          <h3>עם חוקי הקסם</h3>
          <p>לוחצות על כלי, והלוח מדליק לכן בדיוק לאן מותר לו ללכת. משבצת אדומה = אפשר לתפוס!</p>
        </button>
        <button class="mode-card mode-free" data-mode="free">
          <div class="mode-icon">✨</div>
          <h3>משחק חופשי</h3>
          <p>בלי חוקים בכלל! מזיזות כל כלי לכל מקום שרוצות. המטרה: לתפוס את המלך של היריבה!</p>
        </button>
      </div>
      <p class="footer-note">נוצר באהבה בשביל לילי 💜</p>
    </section>

    <section id="gameScreen" class="screen hidden">
      <div class="game-top">
        <button id="backBtn" class="icon-btn" title="חזרה לתפריט" aria-label="חזרה לתפריט">🏠</button>
        <div id="turnIndicator" class="turn-indicator"></div>
        <div class="top-actions">
          <button id="undoBtn" class="icon-btn" title="ביטול המהלך האחרון" aria-label="ביטול המהלך האחרון">↩️</button>
          <button id="resetBtn" class="icon-btn" title="התחלה מחדש" aria-label="התחלה מחדש">🔄</button>
        </div>
      </div>
      <div class="board-wrap">
        <div id="capturedTop" class="captured-tray" aria-hidden="true"></div>
        <div class="board-frame">
          <div id="board" class="board" role="group" aria-label="לוח השחמט. נווטו עם מקשי החצים, בחרו עם Enter"></div>
          <div id="piecesLayer" class="pieces-layer"></div>
        </div>
        <div id="capturedBottom" class="captured-tray" aria-hidden="true"></div>
      </div>
      <p class="keyboard-hint">אפשר לשחק גם עם המקלדת: חצים להזזת הסמן, Enter לבחירה, Esc לביטול בחירה.</p>
    </section>
  </main>

  <div id="promotionModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="promotionTitle">
    <div class="modal-card">
      <h3 id="promotionTitle">למה הופכת החיילת הקטנה?</h3>
      <div id="promotionOptions" class="promotion-options"></div>
    </div>
  </div>

  <div id="endModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="modal-card end-card">
      <div id="endEmoji" class="end-emoji" aria-hidden="true">🎉</div>
      <h2 id="endTitle"></h2>
      <p id="endSubtitle"></p>
      <button id="playAgainBtn" class="primary-btn">שחקו שוב</button>
      <button id="menuFromEndBtn" class="ghost-btn">לתפריט הראשי</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
