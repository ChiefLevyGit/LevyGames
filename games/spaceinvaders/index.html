<!-- הגשר לשכבת האחסון המשותפת. חייב להיטען לפני הסקריפט של המשחק. -->
<script src="../../js/levygames-bridge.js?v=1"></script>
<script>
// === CONSTANTS ===
const CW=800, CH=600;
const PLAYER_SPD=240, COLS=11, ROWS=6;
const CELL_W=58, CELL_H=48, DRAW_W=42, DRAW_H=34;
const MOVE_STEP=14, DROP_STEP=20;
const BASE_MS=900, MIN_MS=85, ANIM_MS=500;
const PB_SPD=450, EB_SPD=185, SHOOT_CHANCE=0.008;
const PCOUNT=12, PLIFE=0.55, PSPD=170, STAR_N=120;
const MAX_LIVES=3, RESPAWN_S=2.8, INVINC_S=2.2, PSIZE=4;
const ROW_TYPES=['crab','crab','octopus','octopus','squid','squid'];
const ROW_PTS=[30,30,20,20,10,10];

// === CANVAS ===
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=CW; canvas.height=CH;

function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t));}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

// === AUDIO ===
const SFX={
  ctx:null, master:null, march:null, marchIdx:0,
  marchNotes:[160,130,110,90],
  init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.master=this.ctx.createGain(); this.master.gain.value=0.35;
    this.master.connect(this.ctx.destination);
    if(this.ctx.state==='suspended')this.ctx.resume();
  },
  _osc(type,freq,gain,start,dur){
    const t=this.ctx.currentTime+start;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain,t); g.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.01);
  },
  _noise(lp,gain,dur){
    const len=Math.floor(this.ctx.sampleRate*dur);
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp;
    const g=this.ctx.createGain(); const t=this.ctx.currentTime;
    g.gain.setValueAtTime(gain,t); g.gain.linearRampToValueAtTime(0,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  laser(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='triangle';
    o.frequency.setValueAtTime(880,t);
    o.frequency.exponentialRampToValueAtTime(110,t+0.12);
    g.gain.setValueAtTime(0.28,t); g.gain.linearRampToValueAtTime(0,t+0.12);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+0.13);
  },
  boom(big){
    if(!this.ctx)return;
    this._noise(big?200:500, big?0.7:0.5, big?0.6:0.13);
    if(big)this._osc('sine',60,0.4,0,0.3);
  },
  startMarch(n){
    if(!this.ctx)return; this.stopMarch();
    this.march=setInterval(()=>this._tick(), lerp(MIN_MS,BASE_MS,n/66));
  },
  updateMarch(n){
    if(!this.ctx||!this.march)return;
    clearInterval(this.march);
    this.march=setInterval(()=>this._tick(), lerp(MIN_MS,BASE_MS,n/66));
  },
  stopMarch(){if(this.march){clearInterval(this.march);this.march=null;}},
  _tick(){if(!this.ctx)return; this._osc('sawtooth',this.marchNotes[this.marchIdx++%4],0.3,0,0.08);},
  victory(){
    if(!this.ctx)return;
    [261.6,329.6,392,523.2,659.3].forEach((f,i)=>this._osc('square',f,0.22,i*0.13,0.18));
  }
};

// === STARS ===
const stars=Array.from({length:STAR_N},()=>({
  x:Math.random()*CW, y:Math.random()*CH,
  r:Math.random()*1.5+0.3, a:Math.random()*0.7+0.3
}));
function drawNebula(){
  const n=G.imgs.nebula;
  if(!n)return;
  ctx.save(); ctx.globalAlpha=0.3;
  if(n[0])ctx.drawImage(n[0],30,50,260,210);
  if(n[1])ctx.drawImage(n[1],470,330,300,240);
  ctx.restore();
}
function drawStars(){
  stars.forEach(s=>{
    ctx.globalAlpha=s.a; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

// === PARTICLES ===
let parts=[];
function emitParts(x,y,col,n=PCOUNT){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*PSPD+40;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,
      life:PLIFE,maxLife:PLIFE,
      col:[col,'#fff','#ffff00'][Math.floor(Math.random()*3)],
      sz:Math.random()*4+2});
  }
}
function updateParts(dt){
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt;});
  parts=parts.filter(p=>p.life>0);
}
function drawParts(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  parts.forEach(p=>{
    const t=p.life/p.maxLife;
    ctx.globalAlpha=t; ctx.fillStyle=p.col;
    const s=p.sz*t; ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  });
  ctx.restore();
}

// === EXPLOSIONS ===
const EXPLOSION_FRAME_S=0.045;
function emitExplosion(x,y){G.fx.push({x,y,frame:0,t:0});}
function updateFx(dt){
  G.fx.forEach(f=>{f.t+=dt; if(f.t>=EXPLOSION_FRAME_S){f.t-=EXPLOSION_FRAME_S;f.frame++;}});
  G.fx=G.fx.filter(f=>f.frame<8);
}
function drawFx(){
  const frames=G.imgs.explosion;
  if(!frames)return;
  G.fx.forEach(f=>{
    const img=frames[f.frame];
    if(img)ctx.drawImage(img,f.x-22,f.y-22,44,44);
  });
}

// === SHIELD ===
function makeShieldMask(){
  const W=22,H=16,m=Array.from({length:H},()=>Array(W).fill(false));
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    if(r<=2&&c>=3&&c<=18)m[r][c]=true;
    else if(r<=10&&c>=1&&c<=20)m[r][c]=true;
  }
  for(let r=7;r<=10;r++) for(let c=8;c<=13;c++)m[r][c]=false;
  for(let r=11;r<H;r++) for(let c=0;c<W;c++)
    if((c>=1&&c<=7)||(c>=14&&c<=20))m[r][c]=true;
  return m;
}
class Shield{
  constructor(x,y){this.x=x;this.y=y;this.px=makeShieldMask();this.W=22;this.H=16;}
  draw(){
    ctx.fillStyle='#00ff41';
    for(let r=0;r<this.H;r++) for(let c=0;c<this.W;c++)
      if(this.px[r][c])ctx.fillRect(this.x+c*PSIZE,this.y+r*PSIZE,PSIZE,PSIZE);
  }
  hit(bx,by){
    const c0=Math.floor((bx-this.x)/PSIZE),r0=Math.floor((by-this.y)/PSIZE);
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const r=r0+dr,c=c0+dc;
      if(r>=0&&r<this.H&&c>=0&&c<this.W&&this.px[r][c]){
        for(let er=r-1;er<=r+1;er++) for(let ec=c-1;ec<=c+1;ec++)
          if(er>=0&&er<this.H&&ec>=0&&ec<this.W)this.px[er][ec]=false;
        return true;
      }
    }
    return false;
  }
}

// === ENEMY ===
class Enemy{
  constructor(type,row,col,x,y){
    this.type=type;this.row=row;this.col=col;
    this.x=x;this.y=y;this.alive=true;this.pts=ROW_PTS[row];this.frame=0;
  }
  bounds(){
    const iw=DRAW_W*0.82,ih=DRAW_H*0.82;
    return{x:this.x+(CELL_W-iw)/2,y:this.y+(CELL_H-ih)/2,w:iw,h:ih};
  }
  draw(imgs){
    if(!this.alive)return;
    const dx=this.x+(CELL_W-DRAW_W)/2,dy=this.y+(CELL_H-DRAW_H)/2;
    const img=imgs.enemy[this.type][this.frame];
    if(!img)return;
    ctx.drawImage(img,dx,dy,DRAW_W,DRAW_H);
  }
}

// === SWARM ===
class Swarm{
  constructor(imgs){
    this.imgs=imgs; this.dir=1; this.moveT=0; this.moveMs=BASE_MS;
    this.animT=0; this.frame=0; this.alive=COLS*ROWS; this.grid=[];
    const sx=(CW-COLS*CELL_W)/2,sy=70;
    for(let r=0;r<ROWS;r++){
      this.grid.push([]);
      for(let c=0;c<COLS;c++)
        this.grid[r].push(new Enemy(ROW_TYPES[r],r,c,sx+c*CELL_W,sy+r*CELL_H));
    }
  }
  living(){const a=[];this.grid.forEach(row=>row.forEach(e=>{if(e.alive)a.push(e);}));return a;}
  update(ms){
    this.animT+=ms;
    if(this.animT>=ANIM_MS){this.animT-=ANIM_MS;this.frame^=1;this.living().forEach(e=>e.frame=this.frame);}
    this.moveT+=ms;
    if(this.moveT>=this.moveMs){
      this.moveT-=this.moveMs;
      const live=this.living();
      let minX=Infinity,maxX=-Infinity;
      live.forEach(e=>{minX=Math.min(minX,e.x);maxX=Math.max(maxX,e.x+CELL_W);});
      if(minX+MOVE_STEP*this.dir<4||maxX+MOVE_STEP*this.dir>CW-4){
        this.dir*=-1; live.forEach(e=>e.y+=DROP_STEP);
      } else {
        live.forEach(e=>e.x+=MOVE_STEP*this.dir);
      }
    }
  }
  tryShoot(){
    if(!this.alive)return null;
    const shooters=[];
    for(let c=0;c<COLS;c++)
      for(let r=ROWS-1;r>=0;r--)
        if(this.grid[r][c].alive){shooters.push(this.grid[r][c]);break;}
    if(!shooters.length)return null;
    if(Math.random()<SHOOT_CHANCE*(66/Math.max(1,this.alive))){
      const s=shooters[Math.floor(Math.random()*shooters.length)];
      return{x:s.x+CELL_W/2,y:s.y+CELL_H};
    }
    return null;
  }
  kill(e){e.alive=false;this.alive--;this.moveMs=lerp(MIN_MS,BASE_MS,this.alive/66);}
  lowestY(){let y=-Infinity;this.living().forEach(e=>y=Math.max(y,e.y+CELL_H));return y;}
  draw(){this.grid.forEach(row=>row.forEach(e=>e.draw(this.imgs)));}
}

// === PLAYER ===
class Player{
  constructor(img){
    this.img=img;this.w=72;this.h=50;
    this.x=CW/2-this.w/2;this.y=CH-this.h-18;
    this.lives=MAX_LIVES;this.canShoot=true;this.alive=true;this.respT=0;this.invT=0;
  }
  update(dt,keys){
    if(!this.alive){
      this.respT-=dt;
      if(this.respT<=0){this.alive=true;this.invT=INVINC_S;this.x=CW/2-this.w/2;}
      return;
    }
    if(this.invT>0)this.invT-=dt;
    if(keys['ArrowLeft']||keys['KeyA'])this.x-=PLAYER_SPD*dt;
    if(keys['ArrowRight']||keys['KeyD'])this.x+=PLAYER_SPD*dt;
    this.x=Math.max(0,Math.min(CW-this.w,this.x));
  }
  shoot(){
    if(!this.canShoot||!this.alive)return null;
    this.canShoot=false; return{x:this.x+this.w/2,y:this.y};
  }
  hit(){
    if(this.invT>0)return false;
    this.lives--;this.alive=false;this.respT=RESPAWN_S;this.canShoot=true;return true;
  }
  draw(){
    if(!this.alive){
      if(Math.floor(Date.now()/120)%2===0){
        ctx.globalAlpha=0.4;ctx.fillStyle='#00ff88';
        ctx.fillRect(this.x,this.y,this.w,this.h);ctx.globalAlpha=1;
      }
      return;
    }
    if(this.invT>0&&Math.floor(this.invT*8)%2===0)ctx.globalAlpha=0.35;
    if(this.img)ctx.drawImage(this.img,this.x,this.y,this.w,this.h);
    else{ctx.fillStyle='#00ffaa';ctx.fillRect(this.x,this.y,this.w,this.h);}
    ctx.globalAlpha=1;
  }
  bounds(){return{x:this.x,y:this.y,w:this.w,h:this.h};}
}

// === STORAGE ===
// השיא נשמר דרך שכבת האחסון המשותפת (js/storage.js) ומתוייג לפרופיל הפעיל.
// הגשר נטען אסינכרונית, ולכן G.hi מתמלא ב-loadAssets ולא כאן.
const STORE_NS='spaceinvaders.v1';
const GAME_ID='spaceinvaders'; // חייב להיות זהה ל-id ב-js/games-data.js
let storage=null;

// === GAME STATE ===
const G={
  state:'loading', score:0, hi:0,
  player:null, swarm:null, pbullet:null, ebullets:[], fx:[],
  shields:[], keys:{}, imgs:{}, lastT:0, raf:null,
  menuFrame:0, menuT:0
};

// === ASSETS ===
function loadImg(src){
  return new Promise((res,rej)=>{
    const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(src); i.src=src;
  });
}
function prescale(img,w,h){
  const oc=document.createElement('canvas');
  oc.width=w; oc.height=h;
  oc.getContext('2d').drawImage(img,0,0,w,h);
  return oc;
}
async function loadAssets(){
  // שכבת האחסון קודם - כדי שמסך הפתיחה יציג את השיא האמיתי של הפרופיל
  const LG=await window.LevyGames.ready;
  if(LG){
    storage=LG.storage;
    const saved=await storage.read(STORE_NS,null);
    G.hi=Number(saved?.hi)||0;
  }
  try{
    const [ship,crab1,crab2,oct1,oct2,sq1,sq2,bp,be,neb1,neb2,life,
      x1,x2,x3,x4,x5,x6,x7,x8]=await Promise.all([
      loadImg('Images/ship.png'),
      loadImg('Images/crab_1.png'), loadImg('Images/crab_2.png'),
      loadImg('Images/octopus_1.png'), loadImg('Images/octopus_2.png'),
      loadImg('Images/squid_1.png'), loadImg('Images/squid_2.png'),
      loadImg('Images/bullet_player.png'), loadImg('Images/bullet_enemy.png'),
      loadImg('Images/nebula_1.png'), loadImg('Images/nebula_2.png'),
      loadImg('Images/icon_life.png'),
      loadImg('Images/explosion_1.png'), loadImg('Images/explosion_2.png'),
      loadImg('Images/explosion_3.png'), loadImg('Images/explosion_4.png'),
      loadImg('Images/explosion_5.png'), loadImg('Images/explosion_6.png'),
      loadImg('Images/explosion_7.png'), loadImg('Images/explosion_8.png'),
    ]);
    G.imgs.ship=prescale(ship,72,50);
    G.imgs.enemy={
      crab:[prescale(crab1,DRAW_W,DRAW_H),prescale(crab2,DRAW_W,DRAW_H)],
      octopus:[prescale(oct1,DRAW_W,DRAW_H),prescale(oct2,DRAW_W,DRAW_H)],
      squid:[prescale(sq1,DRAW_W,DRAW_H),prescale(sq2,DRAW_W,DRAW_H)],
    };
    G.imgs.bulletPlayer=prescale(bp,10,32);
    G.imgs.bulletEnemy=prescale(be,14,9);
    G.imgs.nebula=[neb1,neb2];
    G.imgs.life=prescale(life,20,20);
    G.imgs.explosion=[x1,x2,x3,x4,x5,x6,x7,x8].map(im=>prescale(im,44,44));
  }catch(e){console.warn('Image load issue:',e);}
  G.state='menu'; startLoop();
}

// === INIT GAME ===
function initGame(){
  G.score=0; G.pbullet=null; G.ebullets=[]; G.fx=[]; parts=[];
  G.player=new Player(G.imgs.ship||null);
  G.swarm=new Swarm(G.imgs);
  const sw=22*PSIZE, gap=(CW-4*sw)/5;
  G.shields=[0,1,2,3].map(i=>new Shield(gap+i*(sw+gap),CH-125));
  SFX.startMarch(66);
  G.state='playing';
}
async function saveHi(){
  if(G.score<=G.hi)return;
  G.hi=G.score;
  if(!storage)return;
  await storage.write(STORE_NS,{hi:G.hi});
  // דיווח ההתקדמות הוא נגזרת של השמירה - לכן הוא כאן, באותו מקום בדיוק
  await storage.reportProgress(GAME_ID,{kind:'score',best:G.hi});
}

// === UPDATE ===
function update(dt){
  if(G.state==='menu'){
    G.menuT+=dt; if(G.menuT>0.55){G.menuT=0;G.menuFrame^=1;}
    return;
  }
  if(G.state!=='playing')return;
  const p=G.player,s=G.swarm;
  p.update(dt,G.keys);
  if(G.keys['Space']&&p.canShoot){
    const b=p.shoot(); if(b){G.pbullet=b;SFX.laser();}
  }
  if(G.pbullet){
    G.pbullet.y-=PB_SPD*dt;
    if(G.pbullet.y+14<0){G.pbullet=null;p.canShoot=true;}
  }
  s.update(dt*1000);
  const shot=s.tryShoot(); if(shot)G.ebullets.push(shot);
  G.ebullets.forEach(b=>b.y+=EB_SPD*dt);
  G.ebullets=G.ebullets.filter(b=>b.y<CH+12);
  updateParts(dt);
  updateFx(dt);
  collide();
  if(s.alive===0){SFX.stopMarch();SFX.victory();saveHi();G.state='victory';}
  if(p.lives<=0&&!p.alive){SFX.stopMarch();saveHi();G.state='gameover';}
  if(s.lowestY()>=p.y){SFX.stopMarch();saveHi();G.state='gameover';}
}

// === COLLIDE ===
function collide(){
  const p=G.player,s=G.swarm;
  if(G.pbullet){
    const pb={x:G.pbullet.x-2,y:G.pbullet.y,w:4,h:14};
    let hit=false;
    outer:for(let r=0;r<ROWS&&!hit;r++) for(let c=0;c<COLS&&!hit;c++){
      const e=s.grid[r][c];
      if(!e.alive||!aabb(pb,e.bounds()))continue;
      G.score+=e.pts; s.kill(e);
      SFX.boom(false); SFX.updateMarch(s.alive);
      emitParts(e.x+CELL_W/2,e.y+CELL_H/2,'#ff7700');
      emitExplosion(e.x+CELL_W/2,e.y+CELL_H/2);
      G.pbullet=null; p.canShoot=true; hit=true;
    }
    if(G.pbullet){
      for(const sh of G.shields)
        if(sh.hit(G.pbullet.x,G.pbullet.y)){G.pbullet=null;p.canShoot=true;break;}
    }
  }
  for(let i=G.ebullets.length-1;i>=0;i--){
    const b=G.ebullets[i],bb={x:b.x-2,y:b.y,w:4,h:10};
    if(p.alive&&aabb(bb,p.bounds())){
      if(p.hit()){SFX.boom(true);emitParts(p.x+p.w/2,p.y+p.h/2,'#00ff88',20);emitExplosion(p.x+p.w/2,p.y+p.h/2);}
      G.ebullets.splice(i,1); continue;
    }
    for(const sh of G.shields)
      if(sh.hit(b.x,b.y)){G.ebullets.splice(i,1);break;}
  }
}

// === RENDER ===
function drawHUD(){
  ctx.font='bold 17px monospace'; ctx.fillStyle='#00ff41';
  ctx.textAlign='left'; ctx.fillText('SCORE: '+G.score,18,26);
  ctx.textAlign='center'; ctx.fillText('HI-SCORE: '+G.hi,CW/2,26);
  const ICON=20,GAP=4,rightEdge=CW-18;
  const lives=G.player?Math.max(0,G.player.lives):0,lifeImg=G.imgs.life;
  for(let i=0;i<lives;i++){
    const ix=rightEdge-(i+1)*(ICON+GAP);
    if(lifeImg)ctx.drawImage(lifeImg,ix,10,ICON,ICON);
  }
  ctx.textAlign='right';
  ctx.fillText('LIVES:',rightEdge-MAX_LIVES*(ICON+GAP)-6,26);
  ctx.strokeStyle='rgba(0,255,65,0.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,34); ctx.lineTo(CW,34); ctx.stroke();
}

function drawMiniEnemy(type,x,y,frame){
  const img=G.imgs.enemy[type][frame];
  if(img)ctx.drawImage(img,x,y,34,26);
}

function renderMenu(){
  ctx.font='bold 50px monospace'; ctx.fillStyle='#00ff41'; ctx.textAlign='center';
  ctx.shadowColor='#00ff41'; ctx.shadowBlur=18;
  ctx.fillText('SPACE INVADERS',CW/2,88); ctx.shadowBlur=0;
  ctx.font='bold 16px monospace'; ctx.fillStyle='#aaa';
  ctx.fillText('— SCORE ADVANCE TABLE —',CW/2,145);
  [['crab','= 30 PTS',200],['octopus','= 20 PTS',258],['squid','= 10 PTS',316]]
    .forEach(([t,lbl,y])=>{
      drawMiniEnemy(t,CW/2-82,y-21,G.menuFrame);
      ctx.font='bold 17px monospace'; ctx.fillStyle='#fff'; ctx.textAlign='left';
      ctx.fillText(lbl,CW/2-36,y);
    });
  if(Math.floor(Date.now()/520)%2===0){
    ctx.font='bold 21px monospace'; ctx.fillStyle='#ffff00'; ctx.textAlign='center';
    ctx.fillText('PRESS SPACE TO START',CW/2,408);
  }
  ctx.font='14px monospace'; ctx.fillStyle='#777'; ctx.textAlign='center';
  ctx.fillText('← → MOVE    SPACE SHOOT',CW/2,448);
  if(G.hi){
    ctx.font='bold 15px monospace'; ctx.fillStyle='#ff8800';
    ctx.fillText('HI-SCORE: '+G.hi,CW/2,488);
  }
}

function renderOverlay(title,col){
  ctx.fillStyle='rgba(0,0,16,0.72)'; ctx.fillRect(0,0,CW,CH);
  ctx.font='bold 56px monospace'; ctx.fillStyle=col; ctx.textAlign='center';
  ctx.shadowColor=col; ctx.shadowBlur=28;
  ctx.fillText(title,CW/2,CH/2-55); ctx.shadowBlur=0;
  ctx.font='bold 24px monospace'; ctx.fillStyle='#fff';
  ctx.fillText('SCORE: '+G.score,CW/2,CH/2+5);
  ctx.font='bold 17px monospace'; ctx.fillStyle='#ffaa00';
  ctx.fillText('HI-SCORE: '+G.hi,CW/2,CH/2+42);
  if(Math.floor(Date.now()/580)%2===0){
    ctx.font='bold 18px monospace'; ctx.fillStyle='#aaffcc';
    ctx.fillText('PRESS SPACE TO CONTINUE',CW/2,CH/2+100);
  }
}

function render(){
  ctx.fillStyle='#000010'; ctx.fillRect(0,0,CW,CH);
  drawNebula();
  drawStars();
  if(G.state==='loading'){
    ctx.font='bold 26px monospace'; ctx.fillStyle='#00ff41'; ctx.textAlign='center';
    ctx.fillText('LOADING...',CW/2,CH/2); return;
  }
  if(G.state==='menu'){renderMenu();return;}
  G.shields.forEach(s=>s.draw());
  G.swarm.draw();
  const be=G.imgs.bulletEnemy;
  G.ebullets.forEach(b=>{
    if(be)ctx.drawImage(be,b.x-7,b.y-4,14,9);
    else{ctx.fillStyle='#ff4444';ctx.fillRect(b.x-2,b.y,4,10);}
  });
  G.player.draw();
  if(G.pbullet){
    const bp=G.imgs.bulletPlayer;
    if(bp)ctx.drawImage(bp,G.pbullet.x-5,G.pbullet.y-16,10,32);
    else{ctx.fillStyle='#ffff44';ctx.fillRect(G.pbullet.x-2,G.pbullet.y,4,14);}
  }
  drawFx();
  drawParts();
  drawHUD();
  if(G.state==='gameover')renderOverlay('GAME OVER','#ff3333');
  else if(G.state==='victory')renderOverlay('YOU WIN!','#00ff88');
}

// === INPUT ===
document.addEventListener('keydown',e=>{
  G.keys[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='Space'){
    if(G.state==='menu'){SFX.init();initGame();}
    else if(G.state==='gameover'||G.state==='victory'){G.state='menu';}
  }
});
document.addEventListener('keyup',e=>{G.keys[e.code]=false;});

// === LOOP ===
function loop(ts){
  let dt=(ts-G.lastT)/1000; G.lastT=ts; if(dt>0.05)dt=0.05;
  update(dt); render(); G.raf=requestAnimationFrame(loop);
}
function startLoop(){G.lastT=performance.now();G.raf=requestAnimationFrame(loop);}

loadAssets();
</script>
</body>
</html>
