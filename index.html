<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Levy Games - דף המשחקים המשפחתי</title>
<meta name="description" content="אוסף המשחקים של משפחת לוי: שחמט לילדות עם חוקי קסם, משחק 54 משימות מצחיקות, קרב חלל קלאסי, ו-10 תיקי חידות היגיון לבלשיות צעירות. הכל בעברית, בחינם, בלי הורדות ובלי פרסומות.">
<meta name="theme-color" content="#DB2777">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Levy Games">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="Levy Games - דף המשחקים המשפחתי">
<meta property="og:description" content="שחמט לילדות, 54 משימות מצחיקות, קרב חלל, וחידות היגיון לבלשיות צעירות. בעברית, בחינם, בלי הורדות ובלי פרסומות.">
<meta property="og:url" content="https://chieflevygit.github.io/LevyGames/">
<meta property="og:image" content="https://chieflevygit.github.io/LevyGames/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Levy Games">
<meta name="twitter:card" content="summary_large_image">

<link rel="canonical" href="https://chieflevygit.github.io/LevyGames/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="app">

  <header class="site-nav">
    <a href="#top" class="brand">
      <span class="brand-emoji">🎮</span>
      <span class="brand-name">Levy Games</span>
    </a>
    <nav class="nav-links" aria-label="ניווט ראשי">
      <a href="#top" class="nav-link active">ראשי</a>
      <a href="#games" class="nav-link">משחקים</a>
      <a href="#daily-mission" class="nav-link">משימת היום</a>
    </nav>
  </header>

  <main id="top">

    <section class="hero">
      <p class="hero-badge">✨ ברוכות הבאות לממלכת המשחקים של לוי!</p>
      <h1 class="hero-title">דניאל, אופיר - איזה כיף שבאתן! ✨</h1>
      <a href="#games" class="btn btn-primary">התחילי לשחק עכשיו 🎮</a>
    </section>

    <section id="games" class="games-section">
      <div class="section-head">
        <h2>✨ המשחקים שלנו</h2>
        <span id="gamesCount" class="section-count"></span>
      </div>
      <div id="gamesGrid" class="games-grid"></div>
    </section>

    <section id="daily-mission" class="mission-section">
      <div id="dailyMissionCard" class="mission-card">
        <!-- מתמלא ב-js/daily-mission.js -->
      </div>
    </section>

    <section id="wishlist" class="wishlist-section">
      <h2>🌟 איזה משחק היית רוצה שנוסיף?</h2>
      <p class="wishlist-intro">כתבי לנו רעיון למשחק, וניקח אותו בחשבון לפורטל!</p>
      <form id="wishlistForm" class="wishlist-form">
        <input
          id="wishlistInput"
          type="text"
          maxlength="120"
          placeholder="לדוגמה: משחק זיכרון עם חיות קסומות..."
          aria-label="הרעיון שלך למשחק חדש"
          required
        >
        <button type="submit" class="btn btn-primary">שליחה ✉️</button>
      </form>
      <div class="wishlist-list-wrap">
        <h3>רשימת המשאלות שלנו</h3>
        <ul id="wishlistList" class="wishlist-list"></ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>כל הזכויות שמורות למשפחת לוי © <span id="year"></span> · נוצר באהבה 💜</p>
  </footer>
</div>

<script type="module" src="js/hub.js?v=6"></script>
<script type="module" src="js/ui-sounds.js?v=3"></script>
<script type="module" src="js/daily-mission.js?v=4"></script>
<script type="module" src="js/wishlist.js?v=4"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
