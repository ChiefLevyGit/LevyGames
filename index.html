<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ממלכת הקסמים - שחמט</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="sky-bg" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="castle-silhouette"></div>
  </div>

  <header class="topbar">
    <h1 class="logo">♛ ממלכת הקסמים <span class="logo-sub">שחמט לילי</span> ♞</h1>
  </header>

  <main>
    <section id="startScreen" class="screen">
      <h2 class="section-title">איך רוצות לשחק היום?</h2>
      <div class="mode-cards">
        <button class="mode-card mode-rules" data-mode="rules">
          <div class="mode-icon">🏰</div>
          <h3>עם חוקי הקסם</h3>
          <p>לוחצות על כלי, והלוח מדליק לכן בדיוק לאן מותר לו ללכת. משבצת אדומה = אפשר לתפוס!</p>
        </button>
        <button class="mode-card mode-free" data-mode="free">
          <div class="mode-icon">✨</div>
          <h3>משחק חופשי</h3>
          <p>בלי חוקים בכלל! מזיזות כל כלי לכל מקום שרוצות. המטרה: לתפוס את המלך של היריבה!</p>
        </button>
      </div>
      <p class="footer-note">נוצר באהבה בשביל לילי 💜</p>
    </section>

    <section id="gameScreen" class="screen hidden">
      <div class="game-top">
        <button id="backBtn" class="icon-btn" title="חזרה לתפריט" aria-label="חזרה לתפריט">🏠</button>
        <div id="turnIndicator" class="turn-indicator"></div>
        <button id="resetBtn" class="icon-btn" title="התחלה מחדש" aria-label="התחלה מחדש">🔄</button>
      </div>
      <div class="board-wrap">
        <div id="capturedTop" class="captured-tray" aria-hidden="true"></div>
        <div class="board-frame">
          <div id="board" class="board"></div>
          <div id="piecesLayer" class="pieces-layer"></div>
        </div>
        <div id="capturedBottom" class="captured-tray" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <div id="promotionModal" class="modal hidden">
    <div class="modal-card">
      <h3>למה הופכת החיילת הקטנה?</h3>
      <div id="promotionOptions" class="promotion-options"></div>
    </div>
  </div>

  <div id="endModal" class="modal hidden">
    <div class="modal-card end-card">
      <div id="endEmoji" class="end-emoji">🎉</div>
      <h2 id="endTitle"></h2>
      <p id="endSubtitle"></p>
      <button id="playAgainBtn" class="primary-btn">שחקו שוב</button>
      <button id="menuFromEndBtn" class="ghost-btn">לתפריט הראשי</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
